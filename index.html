<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava | Mazda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>

    <main class="page">
        <div class="card">
            <div class="logo">Mazda</div>

            <input class="radio" type="radio" name="tab" id="r-login" checked>
            <input class="radio" type="radio" name="tab" id="r-signup">

            <div class="tabs">
                <label class="tab" for="r-login">Prijava</label>
                <label class="tab" for="r-signup">Registracija</label>
            </div>

            <form id="login-form">
                <p class="lead">Prosimo, vnesite svoj e-poštni naslov in geslo</p>

                <input type="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
                <input type="password" placeholder="Geslo" aria-label="Geslo" autocomplete="current-password" required>

                <button class="btn" type="submit">Prijava</button>
                <a class="forgot" href="#">Ste pozabili geslo?</a>
            </form>


            <form id="signup-form">
                <p class="lead">Izpolnite podatke za ustvarjanje računa</p>

                <input type="text" placeholder="Ime" aria-label="Ime" autocomplete="given-name" required>
                <input type="text" placeholder="Priimek" aria-label="Priimek" autocomplete="family-name" required>
                <input type="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
                <input type="password" placeholder="Geslo" aria-label="Geslo" autocomplete="new-password" minlength="8" required>
                <input type="password" placeholder="Ponovite geslo" aria-label="Ponovite geslo" autocomplete="new-password" minlength="8" required>

                <button class="btn" type="submit">Registracija</button>
            </form>

            <p class="small">Z nadaljevanjem se strinjate s <a href="#">pogoji uporabe</a>.</p>
        </div>
    </main>

</body>

</html>
